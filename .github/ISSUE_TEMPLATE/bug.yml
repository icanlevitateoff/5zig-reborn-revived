name: Bug
description: Something in 5zig Reborn Revived doesn't work as expected (no crash).
title: "[Bug] "
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! If the game crashed, use the **Crash** template instead.
        Online features (friends, chat network, capes, reward tags) are not available while there is no backend; see the README.
  - type: dropdown
    id: mc-version
    attributes:
      label: Minecraft version
      options:
        - "26.3"
        - "1.21.11"
        - "1.21.10"
        - "1.21.9"
        - "1.21.8"
        - "1.21.7"
        - "1.21.6"
        - "1.21.5"
        - "1.21.4"
        - "1.21.3"
        - "1.21.2"
        - "1.21.1"
        - "1.21"
        - "1.20.4"
        - "1.20.3"
        - "1.20.1"
        - "1.20"
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: From the jar name or the title screen, e.g. `1.21.8-v0.5.0`.
      placeholder: 1.21.8-v0.5.0
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: Fabric Loader and Fabric API versions
      placeholder: Loader 0.17.2, Fabric API 0.136.1+1.21.8
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Options
        2. Resize the window
        3. ...
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server (if it only happens on one)
      placeholder: e.g. mc.example.net, singleplayer
  - type: textarea
    id: mods
    attributes:
      label: Other mods installed
      description: List them, or write "none". If it only happens with a certain mod installed, use the **Mod Compatibility** template.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant part of `.minecraft/logs/latest.log` (or attach the file).
      render: text
