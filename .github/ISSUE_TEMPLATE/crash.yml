name: Crash
description: The game crashed or would not start with 5zig Reborn Revived installed.
title: "[Crash] "
labels: ["bug", "crash"]
body:
  - type: markdown
    attributes:
      value: |
        Please attach the crash report: it is in `.minecraft/crash-reports/` and usually contains a **5zig Reborn Revived** section.
        If "Upload Crash Reports" is on (the default), the mod uploads it to mclo.gs and shows and copies the link the next time you start the game; the link is also at the end of the crash report. Pasting that link is enough.
        If the game closed without a crash report, attach `.minecraft/logs/latest.log` instead.
  - type: dropdown
    id: mc-version
    attributes:
      label: Minecraft version
      options:
        - "26.3"
        - "1.21.10"
        - "1.21.9"
        - "1.21.8"
        - "1.21.7"
        - "1.21.6"
        - "1.21.5"
        - "1.21.4"
        - "1.21.3"
        - "1.21.2"
        - "1.21.1"
        - "1.21"
        - "1.20.4"
        - "1.20.3"
        - "1.20.1"
        - "1.20"
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      placeholder: 1.21.8-v0.3.0
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: Fabric Loader and Fabric API versions
      placeholder: Loader 0.17.2, Fabric API 0.136.1+1.21.8
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: When does it crash?
      options:
        - While starting the game
        - On the title screen / in menus
        - Joining a world or server
        - In game
        - In a 5zig screen or setting
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: what-doing
    attributes:
      label: What were you doing?
      description: The last thing you did before the crash, and whether it happens every time.
    validations:
      required: true
  - type: textarea
    id: crash-report
    attributes:
      label: Crash report
      description: Paste the mclo.gs link or the whole crash report here, or drag the file into this box.
      render: text
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods installed
      description: List them, or write "none".
    validations:
      required: true
